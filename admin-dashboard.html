<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AgroVerse — Admin</title>
    <link rel="stylesheet" href="style.css" />
 <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

</head>

<body>
    <div class="topbar">
        <div class="logo">AgroVerse — Admin</div>
        <nav class="nav"><a href="admin-dashboard.html" class="active">Admin</a><a href="#" id="alogout">Logout</a>
        </nav>
    </div>
    <main class="container admin">
        <section class="admin-panel card">
            <h3>Manage Crops</h3>
            <div id="adminCropList"></div>
            <h4>Add crop</h4><label>Name<input id="adminCropName" /></label><label>Image URL<input
                    id="adminCropImage" /></label>
            <div class="row"><button id="addCrop" class="btn primary">Add</button><button id="resetData"
                    class="btn ghost">Reset Demo</button></div>
        </section>
        <aside class="assistant" id="assistantAdmin"><button id="chatToggleAdmin" class="chat-btn">AI</button>
            <div id="chatPanelAdmin" class="chat-panel" style="display:none">
                <div class="chat-header"><strong>Agro AI</strong></div>
                <div id="chatBodyAdmin" class="chat-body"></div>
                <div class="chat-input"><input id="chatInputAdmin" /><button id="sendChatAdmin"
                        class="btn">Send</button></div>
            </div>
        </aside>
    </main>

    <div>
  <h3>Plant Sensor Data</h3>
  <p id="temperature"></p>
  <p id="humidity"></p>
  <p id="soil_moisture"></p>
  <p id="sunlight"></p>

  <h3>AI Crop Report</h3>
  <pre id="ai_report"></pre>
</div>

<script>
async function updateDashboard() {
    const res = await fetch("http://127.0.0.1:8000/api/analyze-crop", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ plant: "Tomato" })
    });
    const data = await res.json();

    document.getElementById("temperature").innerText = "Temperature: " + data.sensor_data.temperature + " °C";
    document.getElementById("humidity").innerText = "Humidity: " + data.sensor_data.humidity + " %";
    document.getElementById("soil_moisture").innerText = "Soil Moisture: " + data.sensor_data.soil_moisture;
    document.getElementById("sunlight").innerText = "Sunlight: " + data.sensor_data.sunlight + " lux";

    document.getElementById("ai_report").innerText = data.analysis;
}

// Update every 10 seconds
setInterval(updateDashboard, 10000);
updateDashboard();
</script>

    <script src="data/crops.js"></script>
    <script src="script.js"></script>
    <script src="ai.js"></script>
</body>

</html>
