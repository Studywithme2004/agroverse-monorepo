  <div>
  <h3>Plant Sensor Data</h3>
  <p id="temperature"></p>
  <p id="humidity"></p>
  <p id="soil_moisture"></p>
  <p id="sunlight"></p>

  <h3>AI Crop Report</h3>
  <pre id="ai_report"></pre>
</div>

<script>
async function updateDashboard() {
    const res = await fetch("https://agroverse-monorepo.onrender.com/api/analyze-crop", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ plant: "Tomato" })
    });
    const data = await res.json();

    document.getElementById("temperature").innerText = "Temperature: " + data.sensor_data.temperature + " °C";
    document.getElementById("humidity").innerText = "Humidity: " + data.sensor_data.humidity + " %";
    document.getElementById("soil_moisture").innerText = "Soil Moisture: " + data.sensor_data.soil_moisture;
    document.getElementById("sunlight").innerText = "Sunlight: " + data.sensor_data.sunlight + " lux";

    document.getElementById("ai_report").innerText = data.analysis;
}

// Update every 10 seconds
setInterval(updateDashboard, 10000);
updateDashboard();
</script>
