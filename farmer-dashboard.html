<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AgroVerse — Farmer</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
<div class="bg-farmer"> 

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="logo">AgroVerse</div>
        <nav class="nav">
            <a href="farmer-dashboard.html" class="active">Dashboard</a>
            <a href="#" id="logout">Logout</a>
        </nav>
    </div>

    <!-- CAROUSEL -->
    <div class="carousel-container">
        <div class="carousel">
            <div class="slide active"><img src="https://smartfarmer.great-site.net/data/tea.jpg"></div>
            <div class="slide"><img src="https://smartfarmer.great-site.net/data/Olives.jpg"></div>
            <div class="slide"><img src="https://smartfarmer.great-site.net/data/cabbage.jpg"></div>
            <div class="slide"><img src="https://smartfarmer.great-site.net/data/wheat-1.jpg"></div>
            <div class="slide"><img src="https://smartfarmer.great-site.net/data/Rice.jpg"></div>
            <div class="slide"><img src="https://smartfarmer.great-site.net/data/maize.webp"></div>
            <div class="slide"><img src="https://smartfarmer.great-site.net/data/tomato-2643774_1280.jpg.webp"></div>
            <div class="slide"><img src="https://smartfarmer.great-site.net/data/pngtree-an-image-of-a-potato-plant-of-a-garden-with-a-picture-image_12931395.jpg"></div>
            <div class="slide"><img src="https://smartfarmer.great-site.net/data/soybean"></div>
            <div class="slide"><img src="https://smartfarmer.great-site.net/data/cotton.jpg"></div>
            <div class="slide"><img src="https://smartfarmer.great-site.net/data/sugarcane.jpg"></div>
        </div>

        <div class="nav prev">&#10094;</div>
        <div class="nav next">&#10095;</div>
        <div class="dots"></div>
    </div>

    <!-- MAIN GRID -->
    <main class="container">
        <section class="grid" id="cropGrid"></section>
    </main>

    <!-- AI CHAT PANEL -->
    <div id="ai-chat-panel">
        <div id="ai-chat-header">
            <span>Agro AI Assistant</span>
            <button id="ai-chat-close">&times;</button>
        </div>
        <div id="ai-chat-messages"></div>
        <input type="text" id="ai-chat-input" placeholder="Type your message..." />
        <button id="ai-chat-send">Send</button>
    </div>

</div>

<!-- SCRIPTS -->
<script src="ai.js"></script>
<script src="ai-chat.js"></script>
<script src="frontend/slider.js"></script>
<script src="crops.js"></script>
<script src="script1.js"></script>

</body>
</html>
