<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AI Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin:0; }
    .chat-box { background: #fff; width: 420px; height: 560px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; }
    .header { padding: 14px 16px; font-weight: 600; border-bottom: 1px solid #eee; }
    .messages { flex: 1; padding: 16px; overflow-y: auto; }
    .msg { margin-bottom: 12px; }
    .msg .who { font-weight:600; margin-bottom:4px; }
    .input-box { display: flex; padding: 12px; border-top: 1px solid #eee; }
    .input-box input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
    .input-box button { margin-left: 8px; padding: 10px 14px; border-radius: 8px; border: none; background: #0066ff; color: white; cursor: pointer; }
    .note { font-size:12px; color:#666; padding:8px 12px; }
  </style>
</head>
<body>
  <div class="chat-box">
    <div class="header">AI Chatbot (OpenAI)</div>
    <div class="messages" id="chat"></div>
    <div class="note">Make sure the backend is running (uvicorn) and .env has your OPENAI_API_KEY.</div>
    <div class="input-box">
      <input id="userInput" type="text" placeholder="Type your message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const API_URL = "https://agroverse-monorepo.onrender.com/api/chat";
    const history = [];

    function appendMessage(who, text) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML = `<div class="who">${who}</div><div class="text">${text.replace(/\n/g, "<br>")}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;
      appendMessage("You", message);
      input.value = "";
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await res.json();
        const reply = data.reply || "No reply";
        appendMessage("Bot", reply);
        history.push({ user: message, bot: reply });
      } catch (err) {
        appendMessage("Bot", "Error connecting to backend: " + err.message);
      }
    }

    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("userInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
