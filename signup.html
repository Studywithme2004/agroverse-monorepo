<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Signup — AgroVerse</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="auth-page">
    <div class="bg" style="background-image: url(assets/leaf-back.png);"></div>
    <main class="auth-card">
        <h2>Create account</h2>
        <form id="signupForm"><label>Full name<input id="fullname" type="text" required /></label>
            <br>
            <br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<label>Email<input
                    id="su_email" type="email" required /></label>
                    <br>
                    <br>
                    <label>Password<input id="su_password" type="password"
                    required /></label>
                    <br>
                    <br>
                    <br>
            <div class="row auth-actions"><button class="btn primary" type="submit">Signup</button><a class="btn ghost"
                    href="index.html">Back</a></div>
            <p id="signupMsg" class="muted small"></p>
        </form>
    </main>
    <script src="script.js"></script>
    
       
</body>

</html>
